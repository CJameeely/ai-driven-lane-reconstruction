<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>RE:BUILD AI Digital Twin</title>
  <style>
    :root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#f2f1ee}canvas{display:block}#growthFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:0}
    #loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#000;color:#9db0c4;font-size:12px;letter-spacing:.14em}#loading.done{display:none}
    /* Camera-bound fire layer: deliberately screen-space, independent of model coordinates. */
    #fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:2;pointer-events:none;transform:translateZ(0)}
    #stage{position:fixed;z-index:6;left:36px;top:30px;color:#eef0f2;font-size:12px;letter-spacing:.18em;text-shadow:0 2px 10px #000}
    #datum{display:none;position:fixed;z-index:5;left:58%;top:43%;bottom:auto;max-width:330px;padding:10px 14px 10px 18px;border-left:1px solid #9db0c4;background:linear-gradient(90deg,rgba(4,9,13,.72),rgba(4,9,13,0));color:#9db0c4;font-size:10px;line-height:1.85;white-space:pre-line;pointer-events:none;text-shadow:0 2px 10px #000}#datum b{color:#f2f1ee;font-size:16px;font-weight:500}#datum:after{content:"";position:absolute;right:100%;top:-1px;width:76px;height:1px;background:linear-gradient(90deg,transparent,#9db0c4)}body[data-stage="data"] #datum,body[data-stage="damage"][data-summary="1"] #datum{display:block}body[data-stage="damage"] #datum{left:36px;top:auto;bottom:106px;max-width:360px}
    #annotations{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}.annotation{position:absolute;width:168px;padding:8px 10px 7px 12px;color:#d6f4ff;background:linear-gradient(90deg,rgba(5,18,28,.86),rgba(5,18,28,.46));border-left:1px solid #79d2ff;font-size:9px;line-height:1.55;letter-spacing:.06em;opacity:0;transform:translate(14px,-50%) scale(.96);transition:opacity .28s,transform .28s;box-shadow:0 0 18px rgba(77,169,232,.08)}.annotation.show{opacity:1;transform:translate(14px,-50%) scale(1)}.annotation:before{content:"";position:absolute;right:100%;top:50%;width:54px;height:1px;background:linear-gradient(90deg,#d6f4ff,#4da9e8)}.annotation strong{display:block;color:#f1fbff;font-size:10px;font-weight:500}.annotation span{color:#79d2ff}.annotation.critical{border-color:#d6f4ff;box-shadow:0 0 16px rgba(214,244,255,.18)}body:not([data-stage="damage"]):not([data-stage="data"]):not([data-stage="return"]) #annotations{display:none}
    #progress{position:fixed;z-index:7;left:36px;right:36px;bottom:68px;height:1px;background:rgba(157,176,196,.2)}#progressFill{height:100%;width:0;background:#c9ddf2;box-shadow:0 0 9px rgba(201,221,242,.6)}
    #controls{position:fixed;z-index:8;right:36px;bottom:22px;display:flex;align-items:center;gap:6px}#returnView{display:none}body[data-stage="almond"] #returnView,body[data-stage="ban"] #returnView,body[data-stage="shikumen"] #returnView{display:block}
    #cityTools{display:none;position:fixed;z-index:9;left:36px;bottom:22px;gap:6px;align-items:center}body[data-stage="city"] #cityTools{display:flex}body[data-stage="city"] #progress,body[data-stage="city"] #controls,body[data-stage="city"] #hint{display:none}.city-state{position:fixed;right:36px;top:30px;z-index:7;color:#9db0c4;font:11px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;text-align:right;display:none}body[data-stage="city"] .city-state{display:block}
    body.static-preview[data-stage="city"] #beforeAfter,body.static-preview[data-stage="city"] #laneView,body.static-preview[data-stage="city"] #heroView,body.static-preview[data-stage="city"] #freeExplore{display:none}
    button{font:10px inherit;letter-spacing:.08em;color:#f2f1ee;background:rgba(2,6,9,.72);border:1px solid rgba(157,176,196,.32);padding:8px 12px;cursor:pointer;backdrop-filter:blur(12px)}button:hover,button.on{background:#9db0c4;color:#000}
    #hint{position:fixed;right:36px;top:28px;z-index:5;color:#8a8c8e;font:11px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;text-align:right;pointer-events:none}
    #quality{position:fixed;z-index:9;right:36px;top:78px;display:flex;gap:4px}#quality button{padding:5px 8px;font-size:8px}body.static-preview #quality{display:none}
    #debugPanel{display:none;position:fixed;z-index:30;right:16px;bottom:16px;padding:10px 12px;background:rgba(0,0,0,.86);border:1px solid #526b7c;color:#9db0c4;font-size:9px;line-height:1.55;white-space:pre}body.debug #debugPanel{display:block}
    #cross{position:fixed;z-index:4;left:50%;top:50%;width:8px;height:8px;transform:translate(-50%,-50%);border:1px solid rgba(242,241,238,.45);pointer-events:none}
    #VRButton{bottom:22px!important;right:22px!important;left:auto!important;width:auto!important;border:1px solid #9db0c4!important;background:#000!important;color:#f2f1ee!important}
    body[data-stage="return"] #datum{display:block;left:36px;top:auto;bottom:106px}body.clean #datum,body.clean #controls,body.clean #hint,body.clean #cross,body.clean #stage,body.clean #progress{display:none}
    body.recording #controls,body.recording #hint,body.recording #cross,body.recording #quality{display:none}
    #filmCaption{display:none;position:fixed;z-index:12;left:12%;right:12%;bottom:46px;text-align:center;color:rgba(242,241,238,.88);font:400 20px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.015em;text-shadow:0 2px 14px #000,0 1px 4px #000;pointer-events:none}
    #filmCaption:before{content:"";position:absolute;z-index:-1;left:8%;right:8%;bottom:-24px;height:96px;background:linear-gradient(0deg,rgba(0,0,0,.48),rgba(0,0,0,0));filter:blur(10px)}
    body.film #filmCaption{display:block}body.film #progress,body.film #cityTools,body.film .city-state,body.film #VRButton{display:none!important}
    body[data-stage="fire"] #growthFrame{filter:brightness(1.35)}body[data-stage="damage"] #growthFrame,body[data-stage="data"] #growthFrame{filter:brightness(1.18) contrast(.94)}
    @media(max-width:720px){#datum{left:48%;top:39%;max-width:48vw}#controls{bottom:18px}.grammar{display:none}#hint{display:none}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <iframe id="growthFrame" title="Growth renderer"></iframe><canvas id="fx"></canvas>
  <output id="telemetry" aria-label="Render telemetry" style="position:fixed;left:-10000px;top:-10000px"></output>
  <output id="debugPanel"></output>
  <div id="loading">LOADING AI DETECTION DATA</div>
  <div id="stage"></div><div id="datum"></div><div id="annotations"></div><div id="cross"></div><div id="progress"><div id="progressFill"></div></div><div id="filmCaption"></div>
  <div id="hint">The auto tour is playing.<br>Press Esc to exit the tour.</div><div id="quality"><button data-quality="low">LOW</button><button data-quality="medium">MEDIUM</button><button data-quality="high">HIGH</button></div>
  <div class="city-state">Reconstruction complete. All 6 units restored.<br>Select a repair grammar.</div>
  <div id="cityTools"><button data-city-grammar="almond">ALMOND</button><button data-city-grammar="ban">BAN</button><button data-city-grammar="shikumen">SHIKUMEN</button><button id="beforeAfter">AFTER</button><button id="laneView">LANE VIEW</button><button id="heroView">HERO VIEW</button><button id="freeExplore">FREE EXPLORE</button></div>
  <div id="controls"><button id="restart">RESTART</button><button id="prev">PREV</button><button id="pause">PAUSE</button><button id="next">NEXT</button><button id="returnView">RETURN TO VIEW</button><button id="city">CITY OVERVIEW</button></div>
  <script type="module" src="experience.js?v=20261111-performance-1"></script>
</body>
</html>
